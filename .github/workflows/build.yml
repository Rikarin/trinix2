name: build

# Both target architectures are built on every change — the whole point of the
# single-Clang-toolchain decision is that arm64 and x86_64 never drift apart,
# and that only holds if CI proves it continuously.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the stages too expensive to gate a pull request on.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ---------------------------------------------------------------------------
  # Every upstream tarball must still hash to exactly what base/sources.json
  # says. Catches a stale pin, a rewritten "release" tarball, or a mirror that
  # started serving something else.
  # ---------------------------------------------------------------------------
  verify-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('base/sources.json') }}
          restore-keys: sources-

      - name: Verify every pinned source checksum
        shell: pwsh
        run: ./scripts/update-sources.ps1 -Verify -Jobs 6

  # ---------------------------------------------------------------------------
  # Phase 0 gate: the build container builds and can cross-build for both
  # arches. Run on both host architectures so no host-arch assumption creeps in.
  # ---------------------------------------------------------------------------
  host-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64
          - runner: ubuntu-24.04-arm
            host: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and verify host-tools container (host ${{ matrix.host }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/host-tools.Dockerfile
          target: host-tools-verify
          push: false
          cache-from: type=gha,scope=host-tools-${{ matrix.host }}
          cache-to: type=gha,mode=max,scope=host-tools-${{ matrix.host }}

  # ---------------------------------------------------------------------------
  # Phase 1. Building LLVM plus two GCC passes and glibc is hours of compute on
  # a 4-vCPU runner, so this does not gate pull requests — it runs nightly and
  # on demand. The pins and the build container are what PRs actually gate on;
  # a toolchain regression shows up in the nightly, which is the right trade for
  # a from-scratch distribution.
  # ---------------------------------------------------------------------------
  toolchain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [verify-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # LLVM plus two sysroots needs far more than a stock runner leaves free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('base/sources.json') }}
          restore-keys: sources-

      - shell: pwsh
        run: ./scripts/build.ps1 -Stage host-tools,llvm,toolchain -Arch ${{ matrix.arch }} -Verify -Progress plain

  # ---------------------------------------------------------------------------
  # Phase 2. Depends on the toolchain job, so it inherits its nightly-only
  # schedule: cross-building the kernel and systemd twice is not something to
  # put in front of every pull request.
  #
  # The boot check is the phase's exit criterion, and it is deliberately part of
  # this job rather than a separate one — a disk image that has not been booted
  # is not evidence of anything.
  # ---------------------------------------------------------------------------
  base-and-image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('base/sources.json') }}
          restore-keys: sources-

      - name: Build the base system and the disk image
        shell: pwsh
        run: ./scripts/build.ps1 -Stage base,image -Arch ${{ matrix.arch }} -Verify -Progress plain

      # -LoginCheck is a superset of -Check: it waits for the same login prompt
      # and then proves the session is what Phase 3 claims — PowerShell, a
      # working .NET, Trinix's own cmdlets, and the C# service running.
      - name: Boot it, log in, and check PowerShell and .NET
        shell: pwsh
        run: ./scripts/run-vm.ps1 -Arch ${{ matrix.arch }} -LoginCheck

      # A second boot rather than more work inside the first: the two exit
      # criteria fail for unrelated reasons, and a single run that dies in the
      # PowerShell half would say nothing about the graphics half.
      - name: Run a Wayland client under the C# compositor
        shell: pwsh
        run: ./scripts/run-vm.ps1 -Arch ${{ matrix.arch }} -GraphicsCheck

      - uses: actions/upload-artifact@v4
        with:
          name: trinix-${{ matrix.arch }}.img
          path: |
            out/trinix-${{ matrix.arch }}.img
            out/trinix-${{ matrix.arch }}.img.sha256

      # The console log is the only evidence of *why* a boot failed, so it is
      # kept whether the step above passed or not.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.arch }}.log
          path: out/serial-${{ matrix.arch }}.log
          if-no-files-found: ignore

  dotnet:
    # src/ builds with the plain dotnet SDK — no toolchain dependency, so this
    # runs independently and stays fast.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/Trinix.slnx --configuration Release
