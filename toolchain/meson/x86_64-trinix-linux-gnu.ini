# Meson cross file: build for Trinix/x86_64.
#
#   meson setup builddir srcdir --cross-file /usr/local/share/trinix/meson/x86_64-trinix-linux-gnu.ini
#
# See the arm64 file for why the container paths are hardcoded.

[binaries]
c          = ['clang', '--target=x86_64-trinix-linux-gnu']
cpp        = ['clang++', '--target=x86_64-trinix-linux-gnu']
ar         = 'llvm-ar'
ranlib     = 'llvm-ranlib'
nm         = 'llvm-nm'
strip      = 'llvm-strip'
objcopy    = 'llvm-objcopy'
readelf    = 'llvm-readelf'
pkg-config = 'pkg-config'
exe_wrapper = ['qemu-x86_64-static', '-L', '/opt/trinix/sysroots/x86_64-trinix-linux-gnu']

[built-in options]
c_args         = ['--sysroot=/opt/trinix/sysroots/x86_64-trinix-linux-gnu', '-march=x86-64-v2']
cpp_args       = ['--sysroot=/opt/trinix/sysroots/x86_64-trinix-linux-gnu', '-march=x86-64-v2']
c_link_args    = ['--sysroot=/opt/trinix/sysroots/x86_64-trinix-linux-gnu', '-fuse-ld=lld']
cpp_link_args  = ['--sysroot=/opt/trinix/sysroots/x86_64-trinix-linux-gnu', '-fuse-ld=lld']
prefix         = '/usr'
sysconfdir     = '/etc'
localstatedir  = '/var'

[properties]
sys_root         = '/opt/trinix/sysroots/x86_64-trinix-linux-gnu'
pkg_config_libdir = '/opt/trinix/sysroots/x86_64-trinix-linux-gnu/usr/lib/pkgconfig:/opt/trinix/sysroots/x86_64-trinix-linux-gnu/usr/share/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system     = 'linux'
kernel     = 'linux'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
