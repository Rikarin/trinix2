# Meson cross file: build for Trinix/arm64.
#
#   meson setup builddir srcdir --cross-file /usr/local/share/trinix/meson/aarch64-trinix-linux-gnu.ini
#
# Meson cross files cannot read environment variables, so the container paths
# (TRINIX_TOOLCHAIN, TRINIX_SYSROOTS) are spelled out here. They must stay in
# sync with docker/host-tools.Dockerfile.
#
# exe_wrapper lets meson run target binaries during configure — used heavily by
# systemd and glib-style projects, and the reason qemu-user-static is in the
# build container.

[binaries]
c          = ['clang', '--target=aarch64-trinix-linux-gnu']
cpp        = ['clang++', '--target=aarch64-trinix-linux-gnu']
ar         = 'llvm-ar'
ranlib     = 'llvm-ranlib'
nm         = 'llvm-nm'
strip      = 'llvm-strip'
objcopy    = 'llvm-objcopy'
readelf    = 'llvm-readelf'
pkg-config = 'pkg-config'
exe_wrapper = ['qemu-aarch64-static', '-L', '/opt/trinix/sysroots/aarch64-trinix-linux-gnu']

[built-in options]
c_args         = ['--sysroot=/opt/trinix/sysroots/aarch64-trinix-linux-gnu', '-march=armv8.2-a']
cpp_args       = ['--sysroot=/opt/trinix/sysroots/aarch64-trinix-linux-gnu', '-march=armv8.2-a']
c_link_args    = ['--sysroot=/opt/trinix/sysroots/aarch64-trinix-linux-gnu', '-fuse-ld=lld']
cpp_link_args  = ['--sysroot=/opt/trinix/sysroots/aarch64-trinix-linux-gnu', '-fuse-ld=lld']
prefix         = '/usr'
sysconfdir     = '/etc'
localstatedir  = '/var'

[properties]
sys_root         = '/opt/trinix/sysroots/aarch64-trinix-linux-gnu'
pkg_config_libdir = '/opt/trinix/sysroots/aarch64-trinix-linux-gnu/usr/lib/pkgconfig:/opt/trinix/sysroots/aarch64-trinix-linux-gnu/usr/share/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system     = 'linux'
kernel     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
